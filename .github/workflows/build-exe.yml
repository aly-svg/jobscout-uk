{name: Build exe, on: [push, workflow_dispatch], permissions: {contents: write}, jobs: {build: {runs-on: windows-latest, defaults: {run: {shell: pwsh}}, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-python@v5, with: {python-version: "3.11"}}, {run: "Expand-Archive JobScoutUK_v1.3.zip -DestinationPath ."}, {run: "cd JobScoutUK ; pip install -r requirements.txt ; pip install pyinstaller ; pyinstaller --noconfirm --onefile --console --name JobScoutUK --add-data 'sample_jobs.json;.' --add-data 'sample_sponsors.json;.' --collect-all jobspy --collect-all bs4 --collect-all soupsieve --hidden-import pdfplumber --hidden-import docx --hidden-import openpyxl app.py"}, {run: "$p = Start-Process -FilePath 'JobScoutUK/dist/JobScoutUK.exe' -PassThru ; Start-Sleep -Seconds 30 ; $ok = $false ; try { $r = Invoke-WebRequest -Uri 'http://127.0.0.1:7861/' -UseBasicParsing ; if ($r.Content -like '*JobScout UK*') { $ok = $true } } catch { } ; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue ; if (-not $ok) { throw 'smoke test failed' }"}, {env: {GH_TOKEN: "${{ github.token }}"}, run: "gh release create v1.3.${{ github.run_number }} JobScoutUK/dist/JobScoutUK.exe --latest --title 'JobScout UK v1.3 build ${{ github.run_number }}' --notes 'Download JobScoutUK.exe and double-click it. If SmartScreen warns: More info -> Run anyway.'"}]}}}
